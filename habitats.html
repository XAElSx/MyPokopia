<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokopia Habitat Dex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Pokopia</h1>
      <div class="top-actions" id="top-actions"><div id="sync-mount"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>

  <main>
    <div class="toolbar">
      <div class="page-head"><h2 class="page-title">Habitat Dex</h2><span id="counter" class="counter"></span></div>
      <input id="search" type="search" placeholder="Search habitat, item, Pokémon" autocomplete="off">
      <div class="filters">
        <div class="seg" role="group" aria-label="Show">
          <button type="button" class="chip active" data-filter="all">All</button>
          <button type="button" class="chip" data-filter="built">Created</button>
          <button type="button" class="chip" data-filter="todo">Not created</button>
          <button type="button" class="chip" data-filter="wish" aria-label="Wishlist" title="Wishlist">★</button>
        </div>
        <select id="area" class="chip" aria-label="Area"></select>
        <select id="dex" class="chip" aria-label="Habitat dex">
          <option value="all">All dexes</option>
          <option value="main">Main</option>
          <option value="basin">Bubbly Basin</option>
          <option value="event">Event</option>
        </select>
      </div>
    </div>
    <ul id="list" class="list"></ul>
    <p class="note">Habitat data from Serebii. Created marks are saved with your progress.</p>
  </main>

  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button type="button" id="panel-close" class="close" aria-label="Close">&times;</button>
    </div>
    <label class="field row">
      <input type="checkbox" id="f-built">
      <span>Created</span>
      <button type="button" id="f-star" class="star" aria-label="Wishlist" title="Wishlist">☆</button>
    </label>
    <button type="button" id="f-cart" class="cart">Add to shopping list</button>
    <p id="f-flavor" class="flavor"></p>
    <div class="field">
      <span class="label">Where</span>
      <span id="f-areas"></span>
    </div>
    <div class="field">
      <span class="label">Requirements</span>
      <ul id="f-reqs" class="habitats"></ul>
    </div>
    <div class="field" id="sec-cond" hidden>
      <span class="label">Placement</span>
      <span id="f-cond"></span>
    </div>
    <div class="field">
      <span class="label">Pokémon that can appear</span>
      <ul id="f-pokemon" class="habitats"></ul>
    </div>
  </aside>

  <script src="data/pokopia-pokemon.js"></script>
  <script src="data/pokopia-habitats.js"></script>
  <script src="data/pokopia-recipes.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/habitats.js"></script>
</body>
</html>
