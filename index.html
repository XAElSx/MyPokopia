<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokopia Pokédex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Pokopia</h1>
      <div class="top-actions" id="top-actions"><div id="sync-mount"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>

  <main>
    <div class="toolbar">
      <div class="page-head"><h2 class="page-title">Pokédex</h2><span id="counter" class="counter"></span></div>
      <input id="search" type="search" placeholder="Search name, specialty, habitat, notes" autocomplete="off">
      <div class="filters">
        <div class="seg" role="group" aria-label="Show">
          <button type="button" class="chip active" data-filter="all">All</button>
          <button type="button" class="chip" data-filter="in">Registered</button>
          <button type="button" class="chip" data-filter="out">Not registered</button>
          <button type="button" class="chip" data-filter="wish" aria-label="Wishlist" title="Wishlist">★</button>
        </div>
        <button type="button" class="chip" id="now-toggle" aria-pressed="false">Find now</button>
        <button type="button" class="chip warn-chip" id="wrong-toggle" aria-pressed="false" hidden>Wrong area</button>
        <select id="dex" class="chip" aria-label="Pokédex">
          <option value="all">All dexes</option>
          <option value="main">Main</option>
          <option value="event">Event</option>
          <option value="basin">Bubbly Basin</option>
        </select>
        <button type="button" class="chip" id="more-toggle" aria-pressed="false">Filters</button>
        <button type="button" class="chip" id="select-toggle" aria-pressed="false">Select</button>
      </div>
      <div class="now" id="more" hidden>
        <select id="f-ideal" class="chip" aria-label="Ideal habitat"></select>
        <select id="f-spec" class="chip" aria-label="Specialty"></select>
        <select id="f-fav" class="chip" aria-label="Favorite"></select>
        <select id="f-flavor" class="chip" aria-label="Favorite flavor"></select>
        <select id="f-where" class="chip" aria-label="Can appear in"></select>
        <select id="f-lives" class="chip" aria-label="Lives in (your area)"></select>
        <button type="button" class="chip small" id="more-reset">Reset</button>
      </div>
      <div class="now" id="now" hidden>
        <span class="sub">Can appear:</span>
        <select id="now-time" class="chip" aria-label="Time of day">
          <option value="morning">Morning</option>
          <option value="day">Day</option>
          <option value="evening">Evening</option>
          <option value="night">Night</option>
        </select>
        <select id="now-weather" class="chip" aria-label="Weather">
          <option value="sun">Sun</option>
          <option value="cloud">Cloud</option>
          <option value="rain">Rain</option>
        </select>
        <span class="sub">Only Pokémon you have not registered yet.</span>
      </div>
    </div>
    <details class="dash" id="dash">
      <summary>Overview</summary>
      <div id="dash-body"></div>
    </details>
    <ul id="list" class="list"></ul>
    <div class="bulk" id="bulk" hidden>
      <span class="sub" id="bulk-count"></span>
      <button type="button" class="chip small" id="bulk-in">Mark registered</button>
      <button type="button" class="chip small" id="bulk-out">Mark not registered</button>
      <button type="button" class="chip small" id="bulk-star">Star</button>
      <button type="button" class="chip small" id="bulk-compare">Compare (2-3)</button>
      <button type="button" class="chip small" id="bulk-visible">Select all shown</button>
    </div>
    <div class="backup">
      <button type="button" id="export" class="link-btn">Export progress</button>
      <button type="button" id="import" class="link-btn">Import progress</button>
      <button type="button" id="snaps-toggle" class="link-btn">Restore an older copy</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
    <ul id="snaps" class="snaps" hidden></ul>
  </main>

  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button type="button" id="panel-close" class="close" aria-label="Close">&times;</button>
    </div>
    <label class="field row">
      <input type="checkbox" id="f-moved">
      <span>Registered</span>
      <button type="button" id="f-star" class="star" aria-label="Wishlist" title="Wishlist">★</button>
    </label>
    <div class="field">
      <span class="label">Specialty</span>
      <ul id="f-specialty" class="habitats specs"></ul>
    </div>
    <div class="field">
      <span class="label">Likes</span>
      <span id="f-likes"></span>
    </div>
    <div class="field">
      <span class="label">Habitats</span>
      <ul id="f-habitat" class="habitats"></ul>
    </div>
    <label class="field">
      <span class="label">Area</span>
      <input type="text" id="f-area" list="area-list" placeholder="Where do they live in your town?">
      <datalist id="area-list"></datalist>
    </label>
    <label class="field">
      <span class="label">Should live in</span>
      <input type="text" id="f-region" placeholder="The area you want them in" list="area-names">
      <span id="f-region-warn" class="warn" hidden></span>
    </label>
    <datalist id="area-names">
      <option value="Withered Wastelands"></option><option value="Bleak Beach"></option><option value="Rocky Ridges"></option>
      <option value="Sparkling Skylands"></option><option value="Palette Town"></option><option value="Cloud Island"></option>
      <option value="Bubbly Basin"></option><option value="Any area"></option>
    </datalist>
    <label class="field">
      <span class="label">Notes</span>
      <textarea id="f-notes" rows="4"></textarea>
    </label>
  </aside>

  <dialog id="compare" class="sync-dialog compare">
    <div class="panel-head">
      <h2>Compare</h2>
      <button type="button" id="compare-close" class="close" aria-label="Close">&times;</button>
    </div>
    <div id="compare-body"></div>
  </dialog>

  <!-- Plain scripts (not modules) so this works when opened straight from the folder. -->
  <script src="data/pokopia-pokemon.js"></script>
  <script src="data/pokopia-habitats.js"></script>
  <script src="data/pokopia-cooking.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
