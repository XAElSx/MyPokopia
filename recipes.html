<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokopia Crafting</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Pokopia</h1>
      <div class="top-actions" id="top-actions"><div id="sync-mount"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>

  <main>
    <div class="toolbar">
      <div class="page-head"><h2 class="page-title">Crafting</h2><span id="counter" class="counter"></span></div>
      <input id="search" type="search" placeholder="Search recipe or material" autocomplete="off">
      <div class="filters">
        <div class="seg" role="group" aria-label="Mode">
          <button type="button" class="chip active" data-mode="craft">Recipes</button>
          <button type="button" class="chip" data-mode="cook">Cooking</button>
        </div>
        <select id="category" class="chip" aria-label="Category"></select>
        <select id="cook-type" class="chip" aria-label="Meal type" hidden></select>
        <select id="cook-flavor" class="chip" aria-label="Flavor" hidden></select>
        <button type="button" id="habitat-only" class="chip">For habitats</button>
        <button type="button" id="list-only" class="chip">On shopping list</button>
      </div>
    </div>
    <ul id="list" class="list"></ul>
    <p class="note">Recipes and item sources from Serebii.</p>
  </main>

  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button type="button" id="panel-close" class="close" aria-label="Close">&times;</button>
    </div>
    <button type="button" id="f-cart" class="cart" hidden>Add to shopping list</button>
    <p id="f-verify" class="flavor" hidden></p>
    <div id="meal" hidden>
      <p id="m-desc" class="flavor"></p>
      <div class="field">
        <span class="label">Type</span>
        <span id="m-type"></span>
      </div>
      <div class="field">
        <span class="label">Ingredients</span>
        <ul id="m-ingredients" class="habitats"></ul>
      </div>
      <div class="field" id="sec-m-helper">
        <span class="label">Helper Pokémon specialty</span>
        <div id="m-helper"></div>
      </div>
      <div class="field" id="sec-m-likers">
        <span class="label">Pokémon who love this flavor</span>
        <div id="m-likers"></div>
      </div>
    </div>
    <div class="field" id="sec-category">
      <span class="label">Category</span>
      <span id="f-category"></span>
    </div>
    <div class="field" id="sec-obtain">
      <span class="label">How to get the recipe</span>
      <ul id="f-obtain" class="habitats"></ul>
    </div>
    <div class="field" id="sec-reqs">
      <span class="label">Needs</span>
      <ul id="f-reqs" class="habitats"></ul>
    </div>
    <div class="field" id="sec-where">
      <span class="label">Where to find it</span>
      <ul id="f-where" class="habitats"></ul>
    </div>
    <div class="field" id="sec-used">
      <span class="label">Used in</span>
      <ul id="f-used" class="habitats"></ul>
    </div>
  </aside>

  <script src="data/pokopia-pokemon.js"></script>
  <script src="data/pokopia-habitats.js"></script>
  <script src="data/pokopia-recipes.js"></script>
  <script src="data/pokopia-cooking.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/recipes.js"></script>
</body>
</html>
